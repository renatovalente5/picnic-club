# Builds the Picnic Club website and publishes it on GitHub Pages.
#
# The site is LIVE on https://picnicclub.pt (since 5 Oct 2026): the production build (no --base)
# writes the CNAME, lets search engines in, and refuses to publish example reviews. The custom
# domain is set in Settings → Pages (and the DNS, in the picnicclub.pt zone on Cloudflare, points
# the apex to GitHub Pages and www to renatovalente5.github.io, DNS only).
#
# Settings → Pages → Source must be "GitHub Actions".
name: Publish site

# Every push runs, docs included: the panel (picnic-club-painel) follows the run of each commit
# to say «Publicado ✓», and a commit with no run would leave it waiting.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Nothing by default: each job asks only for what it uses.
# Actions are pinned by commit; the tag is in the comment.
permissions: {}

# One publication at a time; a newer push cancels the one still running.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      indexnow: ${{ steps.indexnow.outputs.payload }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # the sitemap's lastmod comes from the git history
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check 'pillow==11.3.0'
      - name: Check that every photo has a description
        run: python scripts/images.py --check
      - name: Build (production, picnicclub.pt)
        run: node scripts/build.mjs --production
      - name: Test the content rules and the translations
        run: node scripts/test-content.mjs
      # The pages whose lastmod differs from the sitemap that is live NOW (before the deploy), for
      # IndexNow (Bing). It never stops a publication. src/lib/indexnow.mjs says why.
      - name: Work out which pages changed (IndexNow)
        id: indexnow
        continue-on-error: true
        run: node scripts/indexnow.mjs
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
      # Only now that the new pages are live: told earlier, Bing would fetch the old ones. 200 and
      # 202 are «accepted»; anything else is a warning, never a failure (the site is already live).
      - name: Tell Bing which pages changed (IndexNow)
        if: ${{ needs.build.outputs.indexnow != '' }}
        continue-on-error: true
        env:
          PAYLOAD: ${{ needs.build.outputs.indexnow }}
        run: |
          code=$(curl -sS -o "$RUNNER_TEMP/indexnow.txt" -w '%{http_code}' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' --data-raw "$PAYLOAD") || true
          echo "IndexNow answered $code"
          cat "$RUNNER_TEMP/indexnow.txt" 2>/dev/null || true
          case "$code" in
            200|202) ;;
            *) echo "::warning title=IndexNow::IndexNow answered $code" ;;
          esac
