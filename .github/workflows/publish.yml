# Builds the Picnic Club website and publishes it on GitHub Pages.
#
# Until picnicclub.pt points here this is the PREVIEW, served from
# https://renatovalente5.github.io/picnic-club/ with noindex and example reviews allowed.
# At go-live, change the build line to `node scripts/build.mjs --production` (no --base):
# that build writes the CNAME and refuses to publish example reviews.
#
# Settings → Pages → Source must be "GitHub Actions".
name: Publish site

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:

# Nothing by default: each job asks only for what it uses.
# Actions are pinned by commit; the tag is in the comment.
permissions: {}

# One publication at a time; a newer push cancels the one still running.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # the sitemap's lastmod comes from the git history
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check 'pillow==11.3.0'
      - name: Check that every photo has a description
        run: python scripts/images.py --check
      - name: Test the content rules and the translations
        run: node scripts/test-content.mjs
      - name: Build (preview)
        run: node scripts/build.mjs --base=/picnic-club --origin=https://renatovalente5.github.io
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
